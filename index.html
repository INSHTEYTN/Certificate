<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#07090F" />
  <title>NVR VIP Turf Club — 3D Horse Racing Casino</title>

  <!-- Premium Casino Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=JetBrains+Mono:wght@500;700;800&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- GSAP & Canvas Confetti via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <!-- Three.js ESM Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <style>
    :root {
      --bg-obsidian: #07090F;
      --bg-panel: rgba(12, 16, 26, 0.88);
      --emerald-deep: #0A3D28;
      --emerald-bright: #126A46;
      --velvet-red: #7A0E1B;
      --velvet-red-bright: #B0172A;
      --gold-main: #D4AF37;
      --gold-light: #FCE08B;
      --gold-dark: #8F6B1F;
      --text-main: #F8F5EC;
      --text-muted: #9AA4B2;
      --border-gold: rgba(212, 175, 55, 0.35);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      background: radial-gradient(circle at 50% 25%, #161018 0%, #07090F 70%);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Portrait Mobile-First Shell (100vw x 100dvh on mobile, 9:16 VIP frame on desktop) */
    #app-shell {
      position: relative;
      width: 100vw;
      height: 100dvh;
      max-width: 100vw;
      max-height: 100dvh;
      background: linear-gradient(180deg, #090C14 0%, #06090F 50%, #0B0E17 100%);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }

    @media (min-width: 520px) and (min-height: 640px) {
      #app-shell {
        width: min(440px, 54dvh);
        height: min(94dvh, 880px);
        border-radius: 28px;
        border: 1.5px solid rgba(212, 175, 55, 0.45);
        box-shadow:
          0 25px 80px rgba(0, 0, 0, 0.85),
          0 0 40px rgba(212, 175, 55, 0.14),
          inset 0 0 24px rgba(212, 175, 55, 0.06);
      }
    }

    /* ==================== PRELOADER / SPLASH SCREEN ==================== */
    #preloader {
      position: absolute;
      inset: 0;
      z-index: 999;
      background: radial-gradient(circle at 50% 42%, #1A1410 0%, #07090F 72%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px;
      text-align: center;
    }

    .vip-frame {
      position: relative;
      width: 100%;
      max-width: 340px;
      padding: 32px 22px;
      border-radius: 22px;
      background: linear-gradient(160deg, rgba(20, 24, 36, 0.92), rgba(7, 9, 15, 0.96));
      border: 1px solid rgba(212, 175, 55, 0.5);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), inset 0 0 30px rgba(212, 175, 55, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .vip-frame::before {
      content: '';
      position: absolute;
      inset: 6px;
      border-radius: 17px;
      border: 1px solid rgba(252, 224, 139, 0.18);
      pointer-events: none;
    }

    .vip-crest {
      width: 68px;
      height: 68px;
      filter: drop-shadow(0 0 14px rgba(212, 175, 55, 0.5));
    }

    .gold-shimmer-title {
      font-family: 'Cinzel', serif;
      font-weight: 900;
      font-size: clamp(24px, 6.2vw, 31px);
      line-height: 1.18;
      letter-spacing: 0.04em;
      background: linear-gradient(110deg, #8F6B1F 0%, #D4AF37 22%, #FFF3C4 48%, #D4AF37 72%, #8F6B1F 100%);
      background-size: 220% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: goldShimmer 2.8s linear infinite;
      text-shadow: 0 2px 18px rgba(212, 175, 55, 0.25);
    }

    @keyframes goldShimmer {
      0% { background-position: 0% center; }
      100% { background-position: 220% center; }
    }

    .vip-subtitle {
      font-size: 11px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--gold-light);
      opacity: 0.85;
      font-weight: 600;
    }

    .progress-wrap {
      width: 100%;
      margin-top: 6px;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid rgba(212, 175, 55, 0.3);
      padding: 1px;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #8F6B1F, #D4AF37, #FCE08B);
      box-shadow: 0 0 12px rgba(252, 224, 139, 0.7);
      transition: width 0.16s ease-out;
    }

    .progress-meta {
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }

    #enter-btn {
      margin-top: 8px;
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      border: 1px solid #FCE08B;
      background: linear-gradient(180deg, #FCE08B 0%, #D4AF37 50%, #9E751F 100%);
      color: #161006;
      font-family: 'Cinzel', serif;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.12em;
      cursor: pointer;
      box-shadow: 0 8px 26px rgba(212, 175, 55, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.7);
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px) scale(0.96);
    }

    #enter-btn:active {
      transform: scale(0.97);
    }

    /* ==================== TOP CASINO HUD ==================== */
    .hud-bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 7px 10px 6px;
      background: linear-gradient(180deg, rgba(16, 20, 32, 0.96) 0%, rgba(9, 12, 20, 0.92) 100%);
      border-bottom: 1px solid var(--border-gold);
      z-index: 20;
    }

    .hud-brand {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #FCE08B, #9A721E);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #120D05;
      font-family: 'Cinzel', serif;
      font-weight: 900;
      font-size: 12px;
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.45);
      flex-shrink: 0;
    }

    .mode-switch {
      display: flex;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 99px;
      padding: 2px;
      gap: 2px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 4px 7px;
      border-radius: 99px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: linear-gradient(180deg, #D4AF37, #976F1C);
      color: #0D0A04;
      box-shadow: 0 2px 8px rgba(212, 175, 55, 0.35);
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22C55E;
      box-shadow: 0 0 8px #22C55E;
      animation: pulseLive 1.4s infinite;
    }

    @keyframes pulseLive {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.75); }
    }

    .hud-right {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .balance-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      background: linear-gradient(180deg, rgba(10, 61, 40, 0.85), rgba(6, 36, 24, 0.95));
      border: 1px solid rgba(212, 175, 55, 0.55);
      border-radius: 99px;
      padding: 4px 8px 4px 9px;
      box-shadow: inset 0 1px 4px rgba(252, 224, 139, 0.15);
    }

    .balance-val {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      font-size: 12.5px;
      color: var(--gold-light);
      letter-spacing: -0.02em;
    }

    .topup-btn {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(180deg, #FCE08B, #C69528);
      color: #161006;
      font-weight: 900;
      font-size: 13px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .icon-btn {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      border: 1px solid rgba(212, 175, 55, 0.32);
      background: rgba(255, 255, 255, 0.05);
      color: var(--gold-light);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.18s ease, transform 0.1s ease;
      flex-shrink: 0;
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    .icon-btn.muted {
      color: #6B7280;
      border-color: rgba(255, 255, 255, 0.12);
    }

    /* ==================== 3D VIEWPORT & LIVE TRACKER ==================== */
    .viewport-section {
      flex: 0 0 auto;
      position: relative;
      width: 100%;
      padding: 6px 8px 4px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stage-wrapper {
      position: relative;
      width: 100%;
      height: clamp(148px, 25.5dvh, 224px);
      border-radius: 14px;
      overflow: hidden;
      border: 1.5px solid rgba(212, 175, 55, 0.5);
      background: #05080F;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.65), inset 0 0 24px rgba(0, 0, 0, 0.6);
    }

    #three-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .stage-overlay-top {
      position: absolute;
      top: 6px;
      left: 7px;
      right: 7px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      z-index: 5;
    }

    .race-status-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(7, 9, 15, 0.78);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 99px;
      padding: 3px 9px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--gold-light);
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }

    .history-pills {
      display: flex;
      align-items: center;
      gap: 3px;
      background: rgba(7, 9, 15, 0.72);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 99px;
      padding: 2px 6px;
    }

    .history-label {
      font-size: 8.5px;
      color: var(--text-muted);
      margin-right: 2px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .hist-dot {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      font-size: 9px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }

    /* Countdown Center Overlay */
    #countdown-banner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 8;
      opacity: 0;
    }

    .countdown-text {
      font-family: 'Cinzel', serif;
      font-weight: 900;
      font-size: 46px;
      color: #FCE08B;
      text-shadow: 0 0 24px rgba(212, 175, 55, 0.95), 0 4px 12px rgba(0, 0, 0, 0.9);
      letter-spacing: 0.06em;
    }

    /* Live Progress Tracker Strip */
    .live-tracker {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(12, 16, 26, 0.9);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 10px;
      padding: 4px 8px;
    }

    .tracker-tag {
      font-size: 8.5px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--gold-main);
      font-family: 'JetBrains Mono', monospace;
      flex-shrink: 0;
    }

    .tracker-rail {
      position: relative;
      flex: 1;
      height: 16px;
      background: linear-gradient(90deg, rgba(10, 61, 40, 0.7), rgba(18, 106, 70, 0.85));
      border-radius: 99px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      overflow: hidden;
    }

    .tracker-rail::after {
      content: '';
      position: absolute;
      right: 4px;
      top: 0;
      bottom: 0;
      width: 4px;
      background: repeating-linear-gradient(0deg, #fff 0 3px, #111 3px 6px);
      opacity: 0.9;
    }

    .tracker-marker {
      position: absolute;
      top: 50%;
      left: 2%;
      transform: translate(-50%, -50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      font-size: 8.5px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
      font-family: 'JetBrains Mono', monospace;
      transition: left 0.08s linear;
    }

    .leaders-mini {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }

    .leader-chip {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 800;
      padding: 1px 4px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Online Live Feed Ticker */
    .online-ticker {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 3px 9px;
      background: linear-gradient(90deg, rgba(10, 61, 40, 0.5), rgba(122, 14, 27, 0.35));
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 8px;
      font-size: 10px;
      color: #E5E7EB;
    }

    .online-ticker.visible {
      display: flex;
    }

    .ticker-msg {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      font-size: 10px;
    }

    .ticker-players {
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 10px;
      color: #4ADE80;
      flex-shrink: 0;
    }

    /* ==================== HORSE SELECTION GRID (6 PARTICIPANTS) ==================== */
    .horses-section {
      flex: 1 1 auto;
      min-height: 0;
      padding: 3px 8px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 6px;
    }

    .horse-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 8px;
      border-radius: 12px;
      background: linear-gradient(145deg, rgba(18, 24, 38, 0.92), rgba(10, 14, 22, 0.96));
      border: 1px solid rgba(212, 175, 55, 0.22);
      cursor: pointer;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.1s ease;
      overflow: hidden;
      min-height: 0;
    }

    .horse-card:active {
      transform: scale(0.97);
    }

    .horse-card.selected {
      border-color: var(--gold-light);
      background: linear-gradient(145deg, rgba(16, 52, 36, 0.92), rgba(10, 22, 18, 0.96));
      box-shadow: 0 0 14px rgba(212, 175, 55, 0.3), inset 0 0 12px rgba(212, 175, 55, 0.12);
    }

    .horse-card.has-bet {
      border-color: rgba(252, 224, 139, 0.65);
    }

    .silk-badge {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 13px;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75);
      border: 1.5px solid rgba(255, 255, 255, 0.45);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.45);
      flex-shrink: 0;
    }

    .horse-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
    }

    .horse-name {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .horse-stats-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .form-bar-bg {
      flex: 1;
      height: 4px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }

    .form-bar-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #D4AF37, #FCE08B);
    }

    .horse-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .odds-led {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      font-size: 12px;
      color: #FCE08B;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(212, 175, 55, 0.35);
      padding: 2px 5px;
      border-radius: 6px;
      text-shadow: 0 0 8px rgba(252, 224, 139, 0.45);
    }

    .bet-badge {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
      font-size: 9.5px;
      font-weight: 800;
      color: #07130D;
      background: linear-gradient(180deg, #4ADE80, #16A34A);
      padding: 1px 5px;
      border-radius: 5px;
      display: none;
    }

    .bet-badge.active {
      display: inline-block;
    }

    /* ==================== BETTING & CHIPS PANEL ==================== */
    .betting-panel {
      flex: 0 0 auto;
      padding: 6px 8px 8px;
      background: linear-gradient(180deg, rgba(14, 18, 28, 0.94) 0%, rgba(8, 10, 16, 0.98) 100%);
      border-top: 1px solid var(--border-gold);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Bet Type Tabs */
    .bet-type-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      background: rgba(0, 0, 0, 0.4);
      padding: 3px;
      border-radius: 10px;
      border: 1px solid rgba(212, 175, 55, 0.22);
    }

    .bet-tab {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      padding: 5px 4px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .bet-tab.active {
      background: linear-gradient(180deg, #7A0E1B, #520811);
      color: var(--gold-light);
      border: 1px solid rgba(212, 175, 55, 0.55);
      box-shadow: 0 2px 10px rgba(122, 14, 27, 0.55);
    }

    /* Casino Chips Row */
    .chips-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
    }

    .chip-btn {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2.5px dashed rgba(255, 255, 255, 0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 10.5px;
      color: #fff;
      cursor: pointer;
      box-shadow:
        0 4px 10px rgba(0, 0, 0, 0.65),
        inset 0 0 0 3px rgba(0, 0, 0, 0.28),

    class SoundEngine {

          [220.00, 261.63, 329.63, 392.00, 493.88], // Am9
          [293.66, 349.23, 440.00, 523.25, 659.25], // Dm9
          [196.00, 246.94, 349.23, 440.00, 659.25]  // G13
        ];
        const bassNotes = [130.81, 110.00, 146.83, 98.00];

        const playStep = () => {
          if (!this.ctx || this.ctx.state !== 'running') return;
          const now = this.ctx.currentTime;
          const chordIdx = Math.floor(this.bgmStep / 4) % chords.length;
          const beat = this.bgmStep % 4;

          // Soft Rhodes electric piano chord on beat 0
          if (beat === 0) {
            const notes = chords[chordIdx];
            notes.forEach((freq, i) => {
              const osc = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, now + i * 0.03);
              g.gain.setValueAtTime(0.0001, now + i * 0.03);
              g.gain.linearRampToValueAtTime(0.055, now + i * 0.03 + 0.06);
              g.gain.exponentialRampToValueAtTime(0.001, now + 2.3);
              osc.connect(g);
              g.connect(this.bgmGain);
              osc.start(now + i * 0.03);
              osc.stop(now + 2.4);
            });
          }

          // Warm lounge bass on beat 0 and 2
          if (beat === 0 || beat === 2) {
            const bOsc = this.ctx.createOscillator();
            const bGain = this.ctx.createGain();
            bOsc.type = 'triangle';
            const freq = beat === 0 ? bassNotes[chordIdx] : bassNotes[chordIdx] * 1.5;
            bOsc.frequency.setValueAtTime(freq, now);
            bGain.gain.setValueAtTime(0.001, now);
            bGain.gain.linearRampToValueAtTime(0.14, now + 0.03);
            bGain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
            bOsc.connect(bGain);
            bGain.connect(this.bgmGain);
            bOsc.start(now);
            bOsc.stop(now + 0.95);
          }

          // Subtle brushed jazz hi-hat on every beat
          if (this.noiseBuffer) {
            const src = this.ctx.createBufferSource();
            src.buffer = this.noiseBuffer;
            const hp = this.ctx.createBiquadFilter();
            hp.type = 'highpass';
            hp.frequency.value = 7500;
            const hg = this.ctx.createGain();
            hg.gain.setValueAtTime(beat % 2 === 1 ? 0.035 : 0.018, now);
            hg.gain.exponentialRampToValueAtTime(0.0005, now + 0.07);
            src.connect(hp);
            hp.connect(hg);
            hg.connect(this.bgmGain);
            src.start(now);
            src.stop(now + 0.08);
          }

          this.bgmStep++;
        };

        this.bgmTimer = setInterval(playStep, 600);
      }

      playClick() {
        if (!this.ctx || this.muted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(920, now);
        osc.frequency.exponentialRampToValueAtTime(340, now + 0.045);
        g.gain.setValueAtTime(0.14, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.connect(g);
        g.connect(this.sfxGain);
        osc.start(now);
        osc.stop(now + 0.055);
      }

      // Authentic ceramic casino chip clink
      playChip() {
        if (!this.ctx || this.muted) return;
        const now = this.ctx.currentTime;
        const freqs = [2450, 3820, 5120];
        freqs.forEach((f, idx) => {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f + (Math.random() - 0.5) * 120, now + idx * 0.006);
          g.gain.setValueAtTime(0.11 / (idx + 1), now + idx * 0.006);
          g.gain.exponentialRampToValueAtTime(0.0008, now + 0.075);
          osc.connect(g);
          g.connect(this.sfxGain);
          osc.start(now + idx * 0.006);
          osc.stop(now + 0.08);
        });
      }

      playCountdown(isGo = false) {
        if (!this.ctx || this.muted) return;
        const now = this.ctx.currentTime;
        if (!isGo) {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, now);
          g.gain.setValueAtTime(0.24, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          osc.connect(g);
          g.connect(this.sfxGain);
          osc.start(now);
          osc.stop(now + 0.3);
        } else {
          // Starting gate brass bell + metallic gate clank
          [880, 1318.5, 1760, 2637].forEach((f, i) => {
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = i % 2 === 0 ? 'triangle' : 'sine';
            osc.frequency.setValueAtTime(f, now);
            g.gain.setValueAtTime(0.2 / (i + 1), now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.85);
            osc.connect(g);
            g.connect(this.sfxGain);
            osc.start(now);
            osc.stop(now + 0.9);
          });
          if (this.noiseBuffer) {
            const src = this.ctx.createBufferSource();
            src.buffer = this.noiseBuffer;
            const bp = this.ctx.createBiquadFilter();
            bp.type = 'bandpass';
            bp.frequency.value = 1200;
            const ng = this.ctx.createGain();
            ng.gain.setValueAtTime(0.35, now);
            ng.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
            src.connect(bp);
            bp.connect(ng);
            ng.connect(this.sfxGain);
            src.start(now);
            src.stop(now + 0.18);
          }
        }
      }

      startRaceAudio() {
        if (!this.ctx || !this.noiseBuffer) return;
        this.stopRaceAudio();
        const now = this.ctx.currentTime;

        // Crowd roar (bandpass filtered noise)
        this.crowdSource = this.ctx.createBufferSource();
        this.crowdSource.buffer = this.noiseBuffer;
        this.crowdSource.loop = true;

        this.crowdFilter = this.ctx.createBiquadFilter();
        this.crowdFilter.type = 'bandpass';
        this.crowdFilter.frequency.setValueAtTime(420, now);
        this.crowdFilter.Q.value = 1.4;

        this.crowdGain = this.ctx.createGain();
        this.crowdGain.gain.setValueAtTime(0.001, now);
        this.crowdGain.gain.linearRampToValueAtTime(0.09, now + 1.0);

        this.crowdSource.connect(this.crowdFilter);
        this.crowdFilter.connect(this.crowdGain);
        this.crowdGain.connect(this.sfxGain);
        this.crowdSource.start(now);

        // Rhythmic hoofbeats
        let hoofIdx = 0;
        const triggerHoof = () => {
          if (!this.ctx || !this.noiseBuffer || this.muted) return;
          const t = this.ctx.currentTime;
          const src = this.ctx.createBufferSource();
          src.buffer = this.noiseBuffer;
          const lp = this.ctx.createBiquadFilter();
          lp.type = 'bandpass';
          lp.frequency.value = 260 + (hoofIdx % 4) * 55;
          lp.Q.value = 2.0;
          const g = this.ctx.createGain();
          g.gain.setValueAtTime(0.16, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.065);
          src.connect(lp);
          lp.connect(g);
          g.connect(this.sfxGain);
          src.start(t);
          src.stop(t + 0.07);
          hoofIdx++;
        };
        this.hoofTimer = setInterval(triggerHoof, 115);
      }

      updateRaceAudio(progress) {
        if (!this.ctx || !this.crowdFilter || !this.crowdGain) return;
        const now = this.ctx.currentTime;
        const excitement = Math.min(1, Math.max(0, progress));
        this.crowdFilter.frequency.setTargetAtTime(420 + excitement * 780, now, 0.15);
        this.crowdGain.gain.setTargetAtTime(0.08 + excitement * 0.22, now, 0.15);
      }

      stopRaceAudio() {
        if (this.hoofTimer) {
          clearInterval(this.hoofTimer);
          this.hoofTimer = null;
        }
        if (this.crowdGain && this.ctx) {
          const now = this.ctx.currentTime;
          this.crowdGain.gain.setTargetAtTime(0.0001, now, 0.15);
          const src = this.crowdSource;
          setTimeout(() => {
            try { if (src) src.stop(); } catch (_) {}
          }, 450);
          this.crowdSource = null;
          this.crowdFilter = null;
          this.crowdGain = null;
        }
      }

      playWin() {
        if (!this.ctx || this.muted) return;
        const now = this.ctx.currentTime;
        // Triumphant brass fanfare
        const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
        notes.forEach((f, idx) => {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sawtooth';
          const lp = this.ctx.createBiquadFilter();
          lp.type = 'lowpass';
          lp.frequency.value = 2600;
          const t = now + idx * 0.095;
          osc.frequency.setValueAtTime(f, t);
          g.gain.setValueAtTime(0.001, t);
          g.gain.linearRampToValueAtTime(0.16, t + 0.03);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.65);
          osc.connect(lp);
          lp.connect(g);
          g.connect(this.sfxGain);
          osc.start(t);
          osc.stop(t + 0.7);
        });
        // Cascading coin chimes
        for (let i = 0; i < 10; i++) {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          const t = now + 0.25 + i * 0.075;
          osc.type = 'sine';
          osc.frequency.setValueAtTime(2800 + Math.random() * 1400, t);
          g.gain.setValueAtTime(0.09, t);
          g.gain.exponentialRampToValueAtTime(0.0008, t + 0.18);
          osc.connect(g);
          g.connect(this.sfxGain);
          osc.start(t);
          osc.stop(t + 0.2);
        }
      }

      playLose() {
        if (!this.ctx || this.muted) return;
        const now = this.ctx.currentTime;
        [293.66, 349.23, 415.30].forEach((f, idx) => {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'triangle';
          const t = now + idx * 0.06;
          osc.frequency.setValueAtTime(f, t);
          osc.frequency.exponentialRampToValueAtTime(f * 0.94, t + 0.55);
          g.gain.setValueAtTime(0.11, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
          osc.connect(g);
          g.connect(this.sfxGain);
          osc.start(t);
          osc.stop(t + 0.65);
        });
      }
    }

    /* =========================================================================
     * 2. PROCEDURAL CANVAS TEXTURE FACTORY
     * ========================================================================= */
    class TextureFactory {
      static createTurfTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');

        // Mowed luxury emerald stripes
        for (let i = 0; i < 8; i++) {
          ctx.fillStyle = i % 2 === 0 ? '#0E5134' : '#12613F';
          ctx.fillRect(i * 64, 0, 64, 512);
        }

        // Subtle organic grass blades noise
        for (let i = 0; i < 6000; i++) {
          const x = Math.random() * 512;
          const y = Math.random() * 512;
          ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.045)' : 'rgba(0,0,0,0.08)';
          ctx.fillRect(x, y, 2, 4);
        }

        // Crisp white lane markings (6 lanes)
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.28)';
        ctx.lineWidth = 2;
        ctx.setLineDash([18, 18]);
        for (let lane = 1; lane < 6; lane++) {
          const y = (lane / 6) * 512;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(512, y);
          ctx.stroke();
        }

        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.ClampToEdgeWrapping;
        tex.repeat.set(16, 1);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }

      static createCheckerTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        const size = 32;
        for (let y = 0; y < 8; y++) {
          for (let x = 0; x < 8; x++) {
            ctx.fillStyle = (x + y) % 2 === 0 ? '#FFFFFF' : '#0B0D12';
            ctx.fillRect(x * size, y * size, size, size);
          }
        }
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }

      static createLedBoardTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');

        const grad = ctx.createLinearGradient(0, 0, 1024, 0);
        grad.addColorStop(0, '#07090F');
        grad.addColorStop(0.5, '#1B1408');
        grad.addColorStop(1, '#07090F');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1024, 128);

        ctx.strokeStyle = '#D4AF37';
        ctx.lineWidth = 5;
        ctx.strokeRect(4, 4, 1016, 120);

        ctx.font = '900 50px Cinzel, serif';
        ctx.fillStyle = '#FCE08B';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('★ NVR CASINO  •  VIP TURF CLUB  •  $ USD ★', 512, 66);

        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.ClampToEdgeWrapping;
        tex.repeat.set(5, 1);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }

      static createSaddleTexture(number, silkHexColor) {
        const canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = silkHexColor;
        ctx.fillRect(0, 0, 128, 128);
        ctx.strokeStyle = '#FCE08B';
        ctx.lineWidth = 8;
        ctx.strokeRect(6, 6, 116, 116);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 72px Montserrat, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(number), 64, 68);

        const tex = new THREE.CanvasTexture(canvas);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }

      static createDistanceSignTexture(label) {
        const canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#0A3D28';
        ctx.fillRect(0, 0, 128, 64);
        ctx.strokeStyle = '#D4AF37';
        ctx.lineWidth = 6;
        ctx.strokeRect(3, 3, 122, 58);
        ctx.fillStyle = '#FCE08B';
        ctx.font = '800 30px JetBrains Mono, monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, 64, 34);
        const tex = new THREE.CanvasTexture(canvas);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }
    }

      updateAnimation(dt, speed, isRacing) {
        if (!isRacing && speed < 0.2) {
          // Subtle idle breathing / pawing in starting box
          this.gallopPhase += dt * 2.2;
          this.bodyGroup.position.y = Math.sin(this.gallopPhase) * 0.02;
          this.bodyGroup.rotation.z = 0;
          this.neckPivot.rotation.z = Math.sin(this.gallopPhase * 0.8) * 0.05;
          this.tailPivot.rotation.z = Math.sin(this.gallopPhase * 1.1) * 0.08;
          this.legs.forEach((leg) => {
            leg.upperPivot.rotation.z *= 0.85;
            leg.lowerPivot.rotation.z *= 0.85;
          });
          return;
        }

        const strideRate = 5.5 + speed * 0.72;
        this.gallopPhase += dt * strideRate;

        // Vertical bounce & slight pitch of horse body
        this.bodyGroup.position.y = Math.abs(Math.sin(this.gallopPhase)) * 0.16;
        this.bodyGroup.rotation.z = Math.cos(this.gallopPhase) * 0.065;

        // Head pump & tail stream
        this.neckPivot.rotation.z = Math.sin(this.gallopPhase - 0.6) * 0.14;
        this.tailPivot.rotation.z = -0.22 + Math.sin(this.gallopPhase * 1.4) * 0.18;

        // Jockey stabilizing bounce
        this.jockeyGroup.position.y = 1.92 - Math.abs(Math.sin(this.gallopPhase)) * 0.06;

        // Articulated 4-beat gallop legs
        this.legs.forEach((leg) => {
          const p = this.gallopPhase + leg.phase * Math.PI * 2;
          const swing = Math.sin(p) * 0.75;
          leg.upperPivot.rotation.z = swing;

          // Knee / hock flexion
          const flex = leg.isFront
            ? Math.max(0, -Math.cos(p)) * -1.05
            : Math.max(0, Math.cos(p)) * 0.85;
          leg.lowerPivot.rotation.z = flex;
        });
      }
    }

    /* =========================================================================
     * 4. 3D TRACK SCENE (THREE.JS + PARTICLES + CINEMATIC CAMERA)
     * ========================================================================= */
    class Track3DScene {
      constructor(canvas, container) {
        this.canvas = canvas;
        this.container = container;
        this.trackLength = 180; // Point A (X=0) to Point B (X=180)
        this.laneZ = [-6.25, -3.75, -1.25, 1.25, 3.75, 6.25];
        this.horses = [];
        this.gateDoors = [];
        this.finishLights = [];
        this.particles = [];
        this.particleIndex = 0;

        this.gateOpenProgress = 0;
        this.cameraOrbitOffset = { x: 0, y: 0 };
        this.isDragging = false;
        this.lastPointer = { x: 0, y: 0 };
        this.photoFinishMode = false;
        this.time = 0;
      }

      async init(onProgress) {
        onProgress(15, 'Создание 3D-рендера...');
        this.renderer = new THREE.WebGLRenderer({
          canvas: this.canvas,
          antialias: true,
          powerPreference: 'high-performance'
        });
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
        this.renderer.toneMappingExposure = 1.15;

        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x060A14);
        this.scene.fog = new THREE.FogExp2(0x060A14, 0.0085);

        this.camera = new THREE.PerspectiveCamera(42, 16 / 9, 0.5, 450);
        this.camera.position.set(10, 7.5, 22);
        this.cameraLookAt = new THREE.Vector3(6, 2.0, 0);

        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.bindCameraInteraction();

        onProgress(35, 'Настройка VIP-освещения...');
        this.setupLighting();

        onProgress(55, 'Генерация ипподрома и трибун...');
        this.buildEnvironment();
        this.buildStartingGates();
        this.buildFinishArch();

        onProgress(78, 'Сборка 3D-лошадей и жокеев...');
        this.buildHorses();
        this.buildParticlePool();

        onProgress(100, 'Зал NVR готов!');
      }

      resize() {
        if (!this.container || !this.renderer) return;
        const w = this.container.clientWidth || 360;
        const h = this.container.clientHeight || 200;
        this.renderer.setSize(w, h, false);
        this.camera.aspect = w / h;
        this.camera.updateProjectionMatrix();
      }

      bindCameraInteraction() {
        const el = this.canvas;
        const start = (x, y) => {
          this.isDragging = true;
          this.lastPointer = { x, y };
        };
        const move = (x, y) => {
          if (!this.isDragging) return;
          const dx = x - this.lastPointer.x;
          const dy = y - this.lastPointer.y;
          this.lastPointer = { x, y };
          this.cameraOrbitOffset.x = THREE.MathUtils.clamp(this.cameraOrbitOffset.x + dx * 0.05, -10, 10);
          this.cameraOrbitOffset.y = THREE.MathUtils.clamp(this.cameraOrbitOffset.y + dy * 0.03, -2, 6);
        };
        const end = () => { this.isDragging = false; };

        el.addEventListener('mousedown', (e) => start(e.clientX, e.clientY));
        window.addEventListener('mousemove', (e) => move(e.clientX, e.clientY));
        window.addEventListener('mouseup', end);

        el.addEventListener('touchstart', (e) => {
          if (e.touches.length === 1) start(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });
        el.addEventListener('touchmove', (e) => {
          if (e.touches.length === 1) move(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });
        el.addEventListener('touchend', end);
      }

      // Point A: 3D Metallic Starting Gates with 12 hinged doors
      buildStartingGates() {

        const goldMat = new THREE.MeshStandardMaterial({ color: 0xD4AF37, metalness: 0.85, roughness: 0.25 });
        const doorMat = new THREE.MeshStandardMaterial({ color: 0x0A3D28, metalness: 0.45, roughness: 0.4 });

        topBeam.position.set(0.4, 3.85, 0);
        this.scene.add(topBeam);

        const goldHeader = new THREE.Mesh(new THREE.BoxGeometry(2.7, 0.22, 16.6), goldMat);
        goldHeader.position.set(0.4, 4.2, 0);

        for (let i = 0; i <= 6; i++) {
          const z = -7.5 + i * 2.5;

          divider.position.set(-0.2, 1.15, z);

          const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 3.9, 8), frameMat);
          pillar.position.set(1.45, 1.95, z);

          const rightPivot = new THREE.Group();
          rightPivot.position.set(1.45, 1.1, zCenter + 1.18);

          rightDoor.position.z = -0.56;

      buildHorses() {
        this.horses = HORSE_CATALOG.map((cfg, idx) => {
          const model = new HorseModel(cfg);
          model.root.position.set(0, 0, this.laneZ[idx]);
          this.scene.add(model.root);
          return model;
        });

      buildParticlePool() {
        const geo = new THREE.SphereGeometry(0.16, 6, 6);
        for (let i = 0; i < 90; i++) {
          const mat = new THREE.MeshBasicMaterial({
            color: i % 3 === 0 ? 0x1E6B47 : 0xA89578,
            transparent: true,
            opacity: 0
          });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.visible = false;
          this.scene.add(mesh);
          this.particles.push({
            mesh,
            vel: new THREE.Vector3(),
            life: 0,
            maxLife: 0.45
          });
        }
      }

      spawnDust(x, z) {
        const p = this.particles[this.particleIndex];
        this.particleIndex = (this.particleIndex + 1) % this.particles.length;
        p.mesh.position.set(x - 0.8 + (Math.random() - 0.5) * 0.4, 0.18, z + (Math.random() - 0.5) * 0.4);
        p.mesh.scale.setScalar(0.6 + Math.random() * 0.7);
        p.vel.set(-2.5 - Math.random() * 2.5, 1.4 + Math.random() * 1.6, (Math.random() - 0.5) * 1.2);
        p.life = p.maxLife;
        p.mesh.visible = true;
      }

      resetGatesAndPositions() {
        this.gateOpenProgress = 0;
        this.photoFinishMode = false;
        this.gateDoors.forEach((g) => {
          g.leftPivot.rotation.y = 0;
          g.rightPivot.rotation.y = 0;
        });
        this.horses.forEach((h, idx) => {
          h.root.position.set(0, 0, this.laneZ[idx]);
          h.updateAnimation(0.016, 0, false);
        });
      }

      openGates() {
        gsap.to(this, {
          gateOpenProgress: 1,
          duration: 0.38,
          ease: 'back.out(1.5)'
        });
      }

      update(dt, raceState) {
        this.time += dt;

        // Animate starting gate doors
        const angle = this.gateOpenProgress * (Math.PI * 0.56);
        this.gateDoors.forEach((g) => {
          g.leftPivot.rotation.y = angle;
          g.rightPivot.rotation.y = -angle;
        });

        // Animate finish arch chase lights
        this.finishLights.forEach((bulb, i) => {
          const wave = Math.sin(this.time * 8 + i * 0.85);
          bulb.material.color.setHex(wave > 0 ? 0xFCE08B : 0x22C55E);
        });

        // Update horses and spawn hoof dust particles
        let leadX = 0;
        let avgX = 0;
        raceState.runners.forEach((r, idx) => {
          const horse = this.horses[idx];
          horse.root.position.x = r.x;
          horse.updateAnimation(dt, r.speed, raceState.phase === 'racing');

          if (r.x > leadX) leadX = r.x;
          avgX += r.x;

          if (raceState.phase === 'racing' && r.speed > 7 && Math.random() < 0.42) {
            this.spawnDust(r.x, this.laneZ[idx]);
          }
        });
        avgX /= raceState.runners.length;

        // Update dust particle pool
        for (let i = 0; i < this.particles.length; i++) {
          const p = this.particles[i];
          if (p.life > 0) {
            p.life -= dt;
            p.mesh.position.addScaledVector(p.vel, dt);
            p.vel.y -= 4.2 * dt;
            const norm = Math.max(0, p.life / p.maxLife);
            p.mesh.material.opacity = norm * 0.65;
            p.mesh.scale.addScalar(dt * 1.4);
            if (p.life <= 0) p.mesh.visible = false;
          }
        }

        // Smoothly decay manual camera orbit during active race
        if (raceState.phase === 'racing' && !this.isDragging) {
          this.cameraOrbitOffset.x *= 0.94;
          this.cameraOrbitOffset.y *= 0.94;
        }

        // Cinematic Camera Tracking
        let targetCamPos = new THREE.Vector3();
        let targetLook = new THREE.Vector3();

        if (raceState.phase === 'betting' || raceState.phase === 'countdown') {
          const sway = Math.sin(this.time * 0.55) * 1.8;
          targetCamPos.set(12.5 + this.cameraOrbitOffset.x + sway, 6.2 + this.cameraOrbitOffset.y, 17.5);
          targetLook.set(2.5, 1.8, 0);
        } else {
          const focusX = leadX * 0.68 + avgX * 0.32;
          const nearFinish = leadX > this.trackLength - 22;

          if (nearFinish) {
            // Dramatic low-angle Photo Finish camera near Point B
            targetCamPos.set(
              Math.min(this.trackLength + 12, focusX + 10) + this.cameraOrbitOffset.x * 0.3,
              4.4 + this.cameraOrbitOffset.y * 0.25,
              14.5
            );
            targetLook.set(Math.min(this.trackLength, leadX), 1.8, 0);
          } else {
            // Dynamic side-3/4 broadcast tracking camera
            targetCamPos.set(
              focusX + 8.5 + this.cameraOrbitOffset.x,
              6.6 + this.cameraOrbitOffset.y,
              21.5
            );
            targetLook.set(focusX + 3.5, 1.8, 0);
          }
        }

        this.camera.position.lerp(targetCamPos, Math.min(1, dt * 4.5));
        this.cameraLookAt.lerp(targetLook, Math.min(1, dt * 6.0));
        this.camera.lookAt(this.cameraLookAt);

        this.renderer.render(this.scene, this.camera);
      }
    }

    /* =========================================================================
     * 5. RACE SIMULATION & DYNAMIC ODDS ENGINE (DETERMINISTIC SEED SUPPORT)
     * ========================================================================= */
    class RaceSimulation {
      constructor(trackLength = 180) {
        this.trackLength = trackLength;
        this.phase = 'betting'; // betting | countdown | racing | finished
        this.runners = [];
        this.finishOrder = [];
        this.elapsed = 0;
        this.slowMoFactor = 1.0;
        this.rng = Math.random;
      }

      generateField(seed = null) {
        this.rng = seed !== null ? mulberry32(seed) : Math.random;
        this.phase = 'betting';
        this.finishOrder = [];
        this.elapsed = 0;
        this.slowMoFactor = 1.0;

        // Generate hidden horse attributes & calculate realistic casino odds
        const rawScores = [];
        this.runners = HORSE_CATALOG.map((cfg, idx) => {
          const baseSpeed = 12.2 + this.rng() * 2.1;
          const stamina = 0.65 + this.rng() * 0.35;
          const sprint = 1.2 + this.rng() * 2.6;
          const consistency = 0.55 + this.rng() * 0.45;
          const power = baseSpeed * 0.5 + stamina * 5.0 + sprint * 0.9 + consistency * 2.0;
          rawScores.push(power);

          return {
            id: cfg.id,
            index: idx,
            name: cfg.name,
            silk: cfg.silk,
            baseSpeed,
            stamina,
            sprint,
            consistency,
            formRating: Math.round(55 + ((power - 11.5) / 6.0) * 44),
            odds: 2.5,
            x: 0,
            speed: 0,
            finished: false,
            finishTime: 0,
            // Pre-rolled deterministic race wave parameters
            reactionDelay: 0.04 + this.rng() * 0.28,
            surgePoint: 0.55 + this.rng() * 0.25,
            surgeDuration: 0.16 + this.rng() * 0.14,
            waveFreq: 0.9 + this.rng() * 1.1,
            wavePhase: this.rng() * Math.PI * 2,
            luckBias: (this.rng() - 0.48) * 1.6
          };
        });

        // Softmax probabilities -> Odds (x1.8 to x14.0 with 5% house edge)
        const maxScore = Math.max(...rawScores);
        const exps = rawScores.map((s) => Math.exp((s - maxScore) * 0.95));
        const sumExp = exps.reduce((a, b) => a + b, 0);

        this.runners.forEach((r, idx) => {
          const prob = exps[idx] / sumExp;
          const rawOdds = (0.95 / prob);
          r.odds = Number(Math.min(14.0, Math.max(1.8, rawOdds)).toFixed(1));
          r.formRating = Math.min(98, Math.max(42, Math.round(40 + prob * 185)));
        });
      }

      startRace() {
        this.phase = 'racing';
        this.elapsed = 0;
        this.finishOrder = [];
        this.slowMoFactor = 1.0;
        this.runners.forEach((r) => {
          r.x = 0;
          r.speed = 0;
          r.finished = false;
          r.finishTime = 0;
        });
      }

      step(rawDt) {
        if (this.phase !== 'racing') return false;

        // Photo-finish slow motion right as leader approaches X=180
        const leadX = Math.max(...this.runners.map((r) => r.x));
        if (leadX > this.trackLength - 9 && this.finishOrder.length < 3) {
          this.slowMoFactor = 0.42;
        } else {
          this.slowMoFactor = Math.min(1.0, this.slowMoFactor + rawDt * 2.2);
        }

        const dt = rawDt * this.slowMoFactor;
        this.elapsed += dt;

        this.runners.forEach((r) => {
          if (this.elapsed < r.reactionDelay) return;

          const progress = Math.min(1.1, r.x / this.trackLength);
          let targetSpeed = r.baseSpeed + r.luckBias;

          // Natural pack rhythm & overtakes
          const wave = Math.sin(this.elapsed * r.waveFreq + r.wavePhase) * (1.55 - r.consistency * 0.7);
          targetSpeed += wave;

          // Final third sprint surge
          if (progress >= r.surgePoint && progress <= r.surgePoint + r.surgeDuration) {
            targetSpeed += r.sprint * 1.15;
          }

          // Fatigue check near end for low-stamina runners
          if (progress > 0.78) {
            targetSpeed -= (1 - r.stamina) * 2.4;
          }

          // Smooth deceleration after crossing finish
          if (r.finished) {
            targetSpeed = Math.max(4.5, targetSpeed * 0.48);
          }

          r.speed += (targetSpeed - r.speed) * Math.min(1, dt * 3.4);
          r.x += Math.max(0, r.speed) * dt;

          if (!r.finished && r.x >= this.trackLength) {
            r.finished = true;
            r.finishTime = this.elapsed;
            this.finishOrder.push(r);
          }
        });

        // Finish race once all 6 cross or leader is well past finish
        if (this.finishOrder.length === 6 || (this.finishOrder.length >= 3 && leadX > this.trackLength + 16)) {
          // Ensure any remaining horses are appended in distance order
          const remaining = this.runners
            .filter((r) => !r.finished)
            .sort((a, b) => b.x - a.x);
          remaining.forEach((r) => {
            r.finished = true;
            this.finishOrder.push(r);
          });
          this.phase = 'finished';
          return true;
        }
        return false;
      }

      getLiveRankings() {
        return [...this.runners].sort((a, b) => {
          if (a.finished && b.finished) return a.finishTime - b.finishTime;
          if (a.finished) return -1;
          if (b.finished) return 1;
          return b.x - a.x;
        });
      }
    }

    /* =========================================================================
     * 6. ONLINE MANAGER (FIRESTORE MULTIPLAYER + DETERMINISTIC SYNC)
     * ========================================================================= */
    class OnlineManager {
      constructor() {
        this.db = null;
        this.auth = null;
        this.user = null;
        this.userId = 'VIP-' + Math.random().toString(36).slice(2, 8).toUpperCase();
        this.nickname = 'VIP Игрок #' + Math.floor(100 + Math.random() * 899);
        this.appId = typeof __app_id !== 'undefined' ? __app_id : 'nvr-vip-turf-club';
        this.connected = false;
        this.leaderboard = [];
        this.recentBets = [];
        this.onlineCount = 1;
        this.onUpdateCallback = null;

        // Global synchronized round cycle: 44 seconds per round
        // 0..22s: Betting | 22..25s: Countdown | 25..39s: Racing | 39..44s: Results
        this.ROUND_DURATION = 44;
        this.BETTING_END = 22;
        this.COUNTDOWN_END = 25;
      }

      async init(onUpdate) {
        this.onUpdateCallback = onUpdate;
        try {
          if (typeof __firebase_config === 'undefined' || !__firebase_config) {
            this.initFallbackRoom();
            return null;
          }
          const firebaseConfig = JSON.parse(__firebase_config);
          const app = initializeApp(firebaseConfig);
          this.auth = getAuth(app);
          this.db = getFirestore(app);

          // RULE 3: Auth before any Firestore query
          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            const cred = await signInWithCustomToken(this.auth, __initial_auth_token);
            this.user = cred.user;
          } else {
            const cred = await signInAnonymously(this.auth);
            this.user = cred.user;
          }

          if (!this.user) {
            this.initFallbackRoom();
            return null;
          }

          this.userId = this.user.uid;
          this.connected = true;

          // Load user's saved USD balance & nickname from private path (RULE 1)
          const profileRef = doc(this.db, 'artifacts', this.appId, 'users', this.userId, 'profile', 'main');
          const snap = await getDoc(profileRef);
          let savedBalance = null;
          if (snap.exists()) {
            const data = snap.data();
            if (typeof data.balance === 'number') savedBalance = data.balance;
            if (data.nickname) this.nickname = data.nickname;
          }

          this.subscribePublicCollections();
          return savedBalance;
        } catch (err) {
          console.warn('Online Firestore fallback active:', err);
          this.initFallbackRoom();
          return null;
        }
      }

      initFallbackRoom() {
        this.connected = false;
        this.onlineCount = 12 + Math.floor(Math.random() * 14);
        this.leaderboard = [
          { uid: 'vip-1', nickname: 'Максим_VIP', balance: 48500 },
          { uid: 'vip-2', nickname: 'Elena_Royale', balance: 32400 },
          { uid: 'vip-3', nickname: 'NVR_Shark', balance: 24900 },
          { uid: this.userId, nickname: this.nickname, balance: 10000 }
        ];
        if (this.onUpdateCallback) this.onUpdateCallback();
      }

      subscribePublicCollections() {
        if (!this.user || !this.db) return;

        // RULE 1 & RULE 2: Simple collection() queries, sort in JS memory
        const lbCol = collection(this.db, 'artifacts', this.appId, 'public', 'data', 'leaderboard');
        onSnapshot(lbCol, (snap) => {
          const list = [];
          snap.forEach((d) => {
            const data = d.data();
            list.push({
              uid: d.id,
              nickname: data.nickname || 'VIP Игрок',
              balance: Number(data.balance || 0),
              updatedAt: Number(data.updatedAt || 0)
            });
          });
          list.sort((a, b) => b.balance - a.balance);
          this.leaderboard = list.slice(0, 12);

          // Count active players in last 10 minutes
          const now = Date.now();
          const active = list.filter((p) => now - p.updatedAt < 600000).length;
          this.onlineCount = Math.max(1, active);
          if (this.onUpdateCallback) this.onUpdateCallback();
        }, (err) => {
          console.warn('Leaderboard snapshot error:', err);
        });

        const betsCol = collection(this.db, 'artifacts', this.appId, 'public', 'data', 'online_bets');
        onSnapshot(betsCol, (snap) => {
          const bets = [];
          snap.forEach((d) => bets.push(d.data()));
          bets.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          this.recentBets = bets.slice(0, 8);
          if (this.onUpdateCallback) this.onUpdateCallback();
        }, (err) => {
          console.warn('Online bets snapshot error:', err);
        });
      }

      async syncProfile(balance) {
        // Update local fallback leaderboard
        const existing = this.leaderboard.find((p) => p.uid === this.userId);
        if (existing) {
          existing.balance = balance;
          existing.nickname = this.nickname;
        } else {
          this.leaderboard.push({ uid: this.userId, nickname: this.nickname, balance });
        }
        this.leaderboard.sort((a, b) => b.balance - a.balance);

        if (!this.user || !this.db) return;
        try {
          const payload = {
            nickname: this.nickname,
            balance: Math.round(balance),
            updatedAt: Date.now()
          };
          await setDoc(doc(this.db, 'artifacts', this.appId, 'users', this.userId, 'profile', 'main'), payload, { merge: true });
          await setDoc(doc(this.db, 'artifacts', this.appId, 'public', 'data', 'leaderboard', this.userId), payload, { merge: true });
        } catch (err) {
          console.warn('Sync profile error:', err);
        }
      }

      async broadcastBet(roundId, horseName, amount, betType) {
        const msg = {
          nickname: this.nickname,
          roundId,
          horseName,
          amount,
          betType,
          createdAt: Date.now()
        };
        this.recentBets.unshift(msg);
        if (this.recentBets.length > 8) this.recentBets.pop();
        if (this.onUpdateCallback) this.onUpdateCallback();

        if (!this.user || !this.db) return;
        try {
          await addDoc(collection(this.db, 'artifacts', this.appId, 'public', 'data', 'online_bets'), msg);
        } catch (err) {
          console.warn('Broadcast bet error:', err);
        }
      }

      getGlobalRoundInfo() {
        const nowSec = Math.floor(Date.now() / 1000);
        const roundId = Math.floor(nowSec / this.ROUND_DURATION);
        const secInRound = nowSec % this.ROUND_DURATION;
        let phase = 'betting';
        let timeLeft = this.BETTING_END - secInRound;
        if (secInRound >= this.BETTING_END && secInRound < this.COUNTDOWN_END) {
          phase = 'countdown';
          timeLeft = this.COUNTDOWN_END - secInRound;
        } else if (secInRound >= this.COUNTDOWN_END) {
          phase = 'racing';
          timeLeft = this.ROUND_DURATION - secInRound;
        }
        return { roundId, secInRound, phase, timeLeft };
      }
    }

    /* =========================================================================
     * 7. GAME STATE (USD BANKROLL, BETS, HISTORY)
     * ========================================================================= */
    class GameState {
      constructor() {
        this.mode = 'solo'; // 'solo' | 'online'
        this.balance = 10000; // Starting VIP Bankroll in USD ($)
        this.raceNumber = 1;
        this.selectedHorseId = 1;
        this.selectedChip = 100;
        this.betType = 'win'; // 'win' | 'place' | 'show'
        this.bets = {}; // { [horseId]: amountUSD }
        this.lastBets = {};
        this.history = []; // last 5 winner IDs
        this.onlineRoundId = null;
        this.onlineRaceTriggered = false;
      }

      getTotalBet() {
        return Object.values(this.bets).reduce((sum, v) => sum + v, 0);
      }

      getEffectiveMultiplier(baseOdds, betType = this.betType) {
        if (betType === 'win') return baseOdds;
        if (betType === 'place') return Math.max(1.2, Number((1 + (baseOdds - 1) * 0.48).toFixed(2)));
        return Math.max(1.1, Number((1 + (baseOdds - 1) * 0.28).toFixed(2)));
      }

      getPotentialMaxWin(runners) {
        let maxWin = 0;
        for (const [hIdStr, amt] of Object.entries(this.bets)) {
          if (amt <= 0) continue;
          const r = runners.find((x) => x.id === Number(hIdStr));
          if (!r) continue;
          const mult = this.getEffectiveMultiplier(r.odds);
          maxWin = Math.max(maxWin, Math.round(amt * mult));
        }
        return maxWin;
      }

      placeBet(horseId, amount) {
        if (amount <= 0 || amount > this.balance) return false;
        this.balance -= amount;
        this.bets[horseId] = (this.bets[horseId] || 0) + amount;
        return true;
      }

      clearBets() {
        const total = this.getTotalBet();
        this.balance += total;
        this.bets = {};
      }

      doubleBets() {
        const total = this.getTotalBet();
        if (total <= 0 || total > this.balance) return false;
        this.balance -= total;
        for (const k of Object.keys(this.bets)) {
          this.bets[k] *= 2;
        }
        return true;
      }

      halfBets() {
        const total = this.getTotalBet();
        if (total <= 0) return false;
        let refunded = 0;
        for (const k of Object.keys(this.bets)) {
          const newVal = Math.floor(this.bets[k] / 2);
          refunded += this.bets[k] - newVal;
          if (newVal <= 0) delete this.bets[k];
          else this.bets[k] = newVal;
        }
        this.balance += refunded;
        return true;
      }

      rebet() {
        const needed = Object.values(this.lastBets).reduce((a, b) => a + b, 0);
        if (needed <= 0) return false;
        this.clearBets();
        if (needed > this.balance) return false;
        for (const [k, v] of Object.entries(this.lastBets)) {
          this.placeBet(Number(k), v);
        }
        return true;
      }

      settleRace(finishOrder) {
        const topIds = finishOrder.map((r) => r.id);
        let totalPayout = 0;
        const winCount = this.betType === 'win' ? 1 : this.betType === 'place' ? 2 : 3;
        const winningSlice = topIds.slice(0, winCount);

        for (const [hIdStr, amt] of Object.entries(this.bets)) {
          const hId = Number(hIdStr);
          if (amt > 0 && winningSlice.includes(hId)) {
            const runner = finishOrder.find((r) => r.id === hId);
            const mult = this.getEffectiveMultiplier(runner.odds);
            totalPayout += Math.round(amt * mult);
          }
        }

        if (this.getTotalBet() > 0) {
          this.lastBets = { ...this.bets };
        }
        this.bets = {};
        this.balance += totalPayout;

        this.history.unshift(topIds[0]);
        if (this.history.length > 5) this.history.pop();

        return totalPayout;
      }
    }

        if (this.state.mode !== 'online') return;
        const info = this.online.getGlobalRoundInfo();

        if (forceInit || this.state.onlineRoundId !== info.roundId) {
          this.state.onlineRoundId = info.roundId;
          this.state.onlineRaceTriggered = false;
          this.state.raceNumber = info.roundId % 10000;
          this.dom.resultModal.classList.remove('open');

          // Deterministic seed ensures every online player gets the exact same horses & winner
          this.sim.generateField(info.roundId * 2654435761);
          this.track3D.resetGatesAndPositions();
          this.renderHorses();
          this.renderHUD();

          // If joined mid-race, wait cleanly for next round
          if (info.phase !== 'betting') {
            this.sim.phase = 'finished';
            this.state.onlineRaceTriggered = true;
          }
        }

        if (info.phase === 'betting' && this.sim.phase === 'betting') {
          this.dom.statusBadge.textContent = `ONLINE #${this.state.raceNumber} • СТАВКИ ${info.timeLeft}s`;
          this.dom.startRaceBtn.disabled = true;
          this.dom.startRaceBtn.textContent = `ОНЛАЙН СТАРТ ЧЕРЕЗ ${info.timeLeft}с`;
        } else if (info.phase === 'countdown' && !this.state.onlineRaceTriggered) {
          this.state.onlineRaceTriggered = true;
          this.beginRaceSequence();
        } else if (this.sim.phase === 'finished') {
          this.dom.statusBadge.textContent = `СЛЕД. ОНЛАЙН ЗАБЕГ: ${info.timeLeft}s`;
          this.dom.startRaceBtn.disabled = true;
          this.dom.startRaceBtn.textContent = `ОЖИДАНИЕ РАУНДА (${info.timeLeft}с)`;
        }
      }

      prepareNextSoloRace() {
        this.state.raceNumber++;
        this.sim.generateField(null);
        this.track3D.resetGatesAndPositions();
        this.renderHorses();
        this.renderHUD();
      }

      buildTrackerMarkers() {
        this.dom.trackerRail.innerHTML = '';
        this.trackerEls = HORSE_CATALOG.map((h) => {
          const el = document.createElement('div');
          el.className = 'tracker-marker';
          el.style.background = h.silk;
          el.textContent = h.id;
          this.dom.trackerRail.appendChild(el);
          return el;
        });
      }

      renderHorses() {
        this.dom.horsesGrid.innerHTML = '';
        this.sim.runners.forEach((r) => {
          const card = document.createElement('div');
          const betAmt = this.state.bets[r.id] || 0;
          const effOdds = this.state.getEffectiveMultiplier(r.odds);
          card.className = 'horse-card' +
            (this.state.selectedHorseId === r.id ? ' selected' : '') +
            (betAmt > 0 ? ' has-bet' : '');

          card.innerHTML = `
            <div class="silk-badge" style="background:${r.silk}">${r.id}</div>
            <div class="horse-info">
              <div class="horse-name">${r.name}</div>
              <div class="horse-stats-row">
                <div class="form-bar-bg">
                  <div class="form-bar-fill" style="width:${r.formRating}%"></div>
                </div>
              </div>
            </div>
            <div class="horse-right">
              <div class="odds-led">x${effOdds.toFixed(1)}</div>
              <div class="bet-badge ${betAmt > 0 ? 'active' : ''}">${formatUSD(betAmt)}</div>
            </div>
          `;

          card.addEventListener('click', () => {
            if (this.sim.phase !== 'betting') return;
            this.state.selectedHorseId = r.id;
            const amount = this.state.selectedChip === 'max' ? this.state.balance : this.state.selectedChip;
            if (amount <= 0) {
              this.showToast('Баланс пуст! Нажмите + для VIP-бонуса');
              return;
            }
            if (this.state.placeBet(r.id, amount)) {
              this.sound.playChip();
              gsap.fromTo(card, { scale: 0.95 }, { scale: 1, duration: 0.2, ease: 'back.out(2)' });
              if (this.state.mode === 'online') {
                this.online.broadcastBet(this.state.onlineRoundId, r.name, amount, this.state.betType);
              }
              this.renderHorses();
              this.renderHUD();
            } else {
              this.showToast('Недостаточно средств на балансе');
            }
          });

          this.dom.horsesGrid.appendChild(card);
        });
      }

      renderHUD() {
        this.animateBalance();
        const totalBet = this.state.getTotalBet();
        const potWin = this.state.getPotentialMaxWin(this.sim.runners);
        this.dom.totalBetVal.textContent = formatUSD(totalBet);
        this.dom.potentialWinVal.textContent = formatUSD(potWin);

        if (this.state.mode === 'solo') {
          if (this.sim.phase === 'betting') {
            this.dom.statusBadge.textContent = `ЗАБЕГ #${this.state.raceNumber} • СТАВКИ`;
            this.dom.startRaceBtn.disabled = false;
            this.dom.startRaceBtn.textContent = totalBet > 0 ? `НАЧАТЬ ЗАБЕГ (${formatUSD(totalBet)})` : 'НАЧАТЬ ЗАБЕГ (ПРОСМОТР)';
          } else if (this.sim.phase === 'racing') {
            this.dom.statusBadge.textContent = `ЗАБЕГ #${this.state.raceNumber} • В ЭФИРЕ`;
            this.dom.startRaceBtn.disabled = true;
            this.dom.startRaceBtn.textContent = 'ИДЕТ ЗАБЕГ...';
          }
        }

        // Render last 5 winners history
        const histHtml = ['<span class="history-label">ИСТ</span>'];
        if (this.state.history.length === 0) {
          histHtml.push('<span style="font-size:9px;color:#6B7280;">—</span>');
        } else {
          this.state.history.forEach((hId) => {
            const cfg = HORSE_CATALOG.find((x) => x.id === hId);
            histHtml.push(`<span class="hist-dot" style="background:${cfg.silk}">${hId}</span>`);
          });
        }
        this.dom.historyPills.innerHTML = histHtml.join('');
      }

      renderOnlineData() {
        this.dom.onlineCount.textContent = String(this.online.onlineCount);
        if (this.online.recentBets.length > 0) {
          const b = this.online.recentBets[0];
          this.dom.tickerMsg.textContent = `${b.nickname} поставил ${formatUSD(b.amount)} на «${b.horseName}»`;
        }

        // Leaderboard list inside modal
        this.dom.lbList.innerHTML = this.online.leaderboard.slice(0, 7).map((p, idx) => `
          <div class="lb-row ${p.uid === this.online.userId ? 'me' : ''}">
            <span><strong>#${idx + 1}</strong> ${p.nickname}</span>
            <span style="font-family:'JetBrains Mono',monospace;color:#FCE08B;font-weight:700;">${formatUSD(p.balance)}</span>
          </div>
        `).join('');
      }

      animateBalance() {
        const target = this.state.balance;
        gsap.to(this, {
          displayedBalance: target,
          duration: 0.5,
          ease: 'power2.out',
          onUpdate: () => {
            this.dom.balanceDisplay.textContent = formatUSD(this.displayedBalance);
          }
        });
      }

      beginRaceSequence() {
        this.sim.phase = 'countdown';
        this.dom.startRaceBtn.disabled = true;
        this.dom.startRaceBtn.textContent = 'ПРИГОТОВИТЬСЯ...';

        const steps = ['3', '2', '1', 'СТАРТ!'];
        let i = 0;

        const runStep = () => {
          const isGo = i === steps.length - 1;
          this.sound.playCountdown(isGo);
          this.dom.countdownText.textContent = steps[i];
          gsap.fromTo(
            this.dom.countdownBanner,
            { opacity: 1, scale: 0.45 },
            { opacity: 0, scale: 1.35, duration: 0.72, ease: 'power2.out' }
          );

          if (isGo) {
            this.track3D.openGates();
            this.sim.startRace();
            this.sound.startRaceAudio();
            this.renderHUD();
          } else {
            i++;
            setTimeout(runStep, 750);
          }
        };
        runStep();
      }

      onRaceFinished() {
        this.sound.stopRaceAudio();
        const totalBet = this.state.getTotalBet();
        const payout = this.state.settleRace(this.sim.finishOrder);
        this.online.syncProfile(this.state.balance);
        this.renderHUD();
        this.renderHorses();

        // Populate Podium Modal
        this.dom.resultTitle.textContent = `РЕЗУЛЬТАТ ЗАБЕГА #${this.state.raceNumber}`;
        const medals = ['🥇 1-е место', '🥈 2-е место', '🥉 3-е место'];
        this.dom.podiumList.innerHTML = this.sim.finishOrder.slice(0, 3).map((r, i) => `
          <div class="podium-row ${i === 0 ? 'first' : ''}">
            <div class="podium-left">
              <span class="hist-dot" style="width:20px;height:20px;font-size:10px;background:${r.silk}">${r.id}</span>
              <span>${r.name}</span>
            </div>
            <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#FCE08B;">${medals[i]} • x${r.odds.toFixed(1)}</span>
          </div>
        `).join('');

        if (payout > 0) {
          this.dom.winBanner.classList.remove('loss');
          this.dom.winLabel.textContent = 'ПОЗДРАВЛЯЕМ! ВАШ ВЫИГРЫШ';
          this.dom.winAmountVal.textContent = '+' + formatUSD(payout);
          this.sound.playWin();
          if (typeof confetti === 'function') {
            confetti({
              particleCount: 85,
              spread: 70,
              origin: { y: 0.55 },
              colors: ['#FCE08B', '#D4AF37', '#FFFFFF', '#22C55E']
            });
          }
        } else {
          this.dom.winBanner.classList.add('loss');
          this.dom.winLabel.textContent = totalBet > 0 ? 'СТАВКА НЕ СЫГРАЛА' : 'ПРОСМОТР ЗАБЕГА ЗАВЕРШЕН';
          this.dom.winAmountVal.textContent = totalBet > 0 ? '-' + formatUSD(totalBet) : '$0';
          if (totalBet > 0) this.sound.playLose();
        }

        this.dom.nextRaceBtn.textContent = this.state.mode === 'online' ? 'ЗАКРЫТЬ' : 'СЛЕДУЮЩИЙ ЗАБЕГ';
        this.dom.resultModal.classList.add('open');
        gsap.fromTo(
          this.dom.resultModal.querySelector('.modal-card'),
          { scale: 0.85, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.38, ease: 'back.out(1.6)' }
        );
      }

      updateLiveTracker() {
        const ranks = this.sim.getLiveRankings();
        this.sim.runners.forEach((r, idx) => {
          const pct = Math.min(97, Math.max(3, (r.x / this.sim.trackLength) * 94 + 3));
          this.trackerEls[idx].style.left = pct + '%';
        });

        const top3 = ranks.slice(0, 3);
        this.dom.leadersMini.innerHTML = top3.map((r, i) => `
          <span class="leader-chip" style="border-color:${r.silk};color:#fff;">
            ${i + 1}:<strong style="color:${r.silk === '#2563EB' ? '#93C5FD' : '#FCE08B'}">#${r.id}</strong>
          </span>
        `).join('');
      }

      showToast(message) {
        this.dom.toast.textContent = message;
        clearTimeout(this.toastTimer);
        gsap.killTweensOf(this.dom.toast);
        gsap.fromTo(this.dom.toast, { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.25 });
        this.toastTimer = setTimeout(() => {
          gsap.to(this.dom.toast, { opacity: 0, y: -10, duration: 0.25 });
        }, 2300);
      }

      animateLoop() {
        requestAnimationFrame(() => this.animateLoop());
        const now = performance.now();
        const dt = Math.min(0.05, (now - this.lastFrameTime) / 1000);
        this.lastFrameTime = now;

        if (this.sim.phase === 'racing') {
          const finishedNow = this.sim.step(dt);
          const leadProgress = Math.max(...this.sim.runners.map((r) => r.x)) / this.sim.trackLength;
          this.sound.updateRaceAudio(leadProgress);
          this.updateLiveTracker();
          if (finishedNow) {
            this.onRaceFinished();
          }
        }

        this.track3D.update(dt, this.sim);
      }
    }

    // Boot application on window load
    window.onload = () => {
      const app = new UIManager();
      app.boot();
    };
  </script>
</body>
</html>
